<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="img/logo.ico">
        <link rel="stylesheet" href="css/reset.css">
        <link rel="stylesheet" href="css/styles.css">
    <title>MundialQuiz</title>
</head>
<body id="paginaPrincipal">
    <button id="btnSonido" aria-label="Silenciar sonido">🔊</button>
    <div id="pantallaPrincipal">
        <div id="contenidoPrincipal">
            <div id="juego">
                <h1 id="tituloPrincial">
                    <span>MundialQuiz</span>
                    <img src="img/logo.png" alt="copaMundo" class="copaMundo">
                </h1>
                <input type="text"  id="usuario" placeholder="Nombre">
                <button id="btnjugar" disabled>Jugar</button>
            </div>
            <div id="tablaHistorica">
                <h2>Ranking Histórico</h2>
                <div class="contenedor-scroll-tabla">
                    <table>
                        <thead>
                            <tr>
                                <th>Nombre</th>
                                <th>Puntos</th>
                                <th>Preguntas</th>
                                <th>Tiempo</th>
                            </tr>
                        </thead>
                        <tbody id="cuerpoTabla">
                            <!-- Aca se asignan los <tr> desde JavaScript -->
                        </tbody>
                    </table>
                </div>
                <button id="btnBorrarRanking">Borrar datos</button>
            </div>
        </div>
        <footer id="contacto">
            <button id="btnAbrirContacto">Informanos un error</button>
            <button id="btnAbrirInstrucciones">¿Cómo se juega?</button>
        </footer>
    </div>
    <div id="pantallaJuego" class="oculto">
        <header id="infoPartida">
            <h4 id="vidas"></h4>
            <h4 id="timer"></h4>
        </header>
        <div id="preguntaOpciones">
            <div id="pregunta"></div>
            <div id="opciones">
                <button id="op1"></button>
                <button id="op2"></button>
                <button id="op3"></button>
                <button id="op4"></button>
            </div>
        </div>
        <footer id="infoPartida2">
            <h4 id="nombre"></h4>
            <h4 id="puntos"></h4>
            <h4 id="contadorPreguntas"></h4>
        </footer>
    </div>
    <div id="pantallaFin" class="oculto">
                <div id="resultadoFin">
            <h2 id="gameOver">Game Over</h2>
            <p id="mensajeFin">Resumen de la partida:</p>
            <div id="resumenFin">
                <p>Puntaje: <span id="puntajeFin"></span></p>
                <p>Correctas: <span id="correctasFin"></span></p>
                <p>Tiempo: <span id="tiempoFin"></span></p>
                <p id="exito" class="oculto">¡Completaste todas las preguntas posibles!</p>
            </div>
            <button id="btnAceptar">Aceptar</button>
        </div>
    </div>
    <div id="modalContacto" class="oculto">
        <div class="modalContenido">
            <button id="btnCerrarModalContacto" class="btnCerrarModal">✕</button>
            <iframe class="iframeModal" src="contacto.html"></iframe>
        </div>
    </div>
    <div id="modalInstrucciones" class="oculto">
        <div class="modalContenido">
            <button id="btnCerrarModalInstrucciones" class="btnCerrarModal">✕</button>
            <iframe class="iframeModal" src="instrucciones.html"></iframe>
        </div>
    </div>
    <script src="js/datos_preguntas.js"></script>
    <script src="js/validaciones.js"></script>
    <script src="js/juego.js"></script>
    <script src="js/modal.js"></script>
    <script src="js/local_storage.js"></script>
    <script src="js/interfaz.js"></script>
    <script src="js/principal.js"></script>
</body>
</html>
